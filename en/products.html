<!DOCTYPE html>
<html lang="en-GB">

  <link rel="alternate" hreflang="en-GB" href="products.html">

</head>
<body>

  <nav class="nav" aria-label="Main menu">
    <div class="wrap nav-inner">
      <a class="brand" href="index.html"><img src="../bilder/Logo.png" alt="">LunnTech</a>
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html">Home</a></li>

        <li><a href="products.html" aria-current="page">Product catalogue</a></li>
        <li><a class="nav-cta" href="contact.html">Contact</a></li>
      </ul>
      <div class="lang-switch" role="group" aria-label="Choose language">
        <a class="flag" href="../produkter.html" hreflang="sv" lang="sv" title="Svenska" aria-label="Svenska"><svg viewBox="0 0 16 10" aria-hidden="true"><rect width="16" height="10" fill="#006AA7"/><rect x="5" width="2" height="10" fill="#FECC02"/><rect y="4" width="16" height="2" fill="#FECC02"/></svg></a>
        <a class="flag" href="products.html" hreflang="en-GB" lang="en-GB" title="English" aria-label="English" aria-current="true"><svg viewBox="0 0 60 30" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><clipPath id="gb-clip"><path d="M30,15h30v15zv15h-30zh-30v-15zv-15h30z"/></clipPath><rect width="60" height="30" fill="#012169"/><path d="M0,0L60,30M60,0L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0L60,30M60,0L0,30" clip-path="url(#gb-clip)" stroke="#C8102E" stroke-width="4"/><path d="M30,0v30M0,15h60" stroke="#fff" stroke-width="10"/><path d="M30,0v30M0,15h60" stroke="#C8102E" stroke-width="6"/></svg></a>
      </div>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="nav-links"><span></span></button>

  <header class="page-head wrap">
    <p class="section-title">Product catalogue</p>
    <h1>A selection of our <span>projects</span></h1>
  </header>

  <main class="wrap">

    <section class="project" id="university-project" aria-labelledby="up-title">
      <div class="project-head">
        <h2 class="project-title" id="up-title">University project</h2>
        <a class="video-link" href="https://youtu.be/1bGIsvOfxW0" target="_blank" rel="noopener">
          <span class="play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg></span>
          Watch the film on YouTube
        </a>
      </div>
      <div class="gallery">
        <figure class="shot photo square span-6">
          <img src="../bilder/web/lasershark1.webp" alt="Laser Shark – the arcade game with three shark targets" width="536" height="505" loading="lazy">
        </figure>
        <figure class="shot photo square span-6 bleed-right">
          <img src="../bilder/web/lasershark2.webp" alt="Laser Shark – the laser pistol" width="625" height="483" loading="lazy">
        </figure>
      </div>
    </section>

    <section class="project" id="ares" aria-labelledby="ares-title">
      <div class="project-head">
        <h2 class="project-title" id="ares-title">ARES</h2>
      </div>
      <div class="gallery">
        <figure class="shot photo span-5" style="--ar: 16 / 10">
          <img src="../bilder/web/ares_foto.webp" alt="ARES – photo of the completed rig" width="1600" height="920" loading="lazy">
        </figure>
        <figure class="shot render span-7">
          <img src="../bilder/web/ares_rendering1.webp" alt="ARES – rendering of the complete system" width="1600" height="851" loading="lazy">
        </figure>
        <figure class="shot render">
          <img src="../bilder/web/ares_rendering2.webp" alt="ARES – exploded view of the filter unit" width="1600" height="598" loading="lazy">
        </figure>
      </div>
    </section>

    <section class="project" id="purify" aria-labelledby="purify-title">
      <div class="project-head">
        <h2 class="project-title" id="purify-title">PURIFY</h2>
      </div>
      <div class="gallery">
        <figure class="shot photo span-6" style="--ar: 3 / 4">
          <img src="../bilder/web/purify_foto.webp" alt="PURIFY – photo of the prototype" width="927" height="1600" loading="lazy">
        </figure>
        <figure class="shot render span-6">
          <img src="../bilder/web/purify_rendering.webp" alt="PURIFY – rendering" width="1280" height="1199" loading="lazy">
        </figure>
      </div>
    </section>

    <section class="project" id="machine-calculator" aria-labelledby="mc-title">
      <div class="project-head">
        <h2 class="project-title" id="mc-title">Machine calculator</h2>
      </div>
      <div class="gallery">
        <figure class="shot render single">
          <img src="../bilder/web/maskinkalkylator_rendering.webp" alt="Machine calculator – rendering" width="1600" height="900" loading="lazy">
        </figure>
      </div>
    </section>

  </main>

  <footer>
    <div class="wrap">© 2026 LunnTech · Lund</div>
  </footer>

  <div class="lightbox" role="dialog" aria-modal="true" aria-label="Enlarged image">
    <button type="button" aria-label="Close">×</button>
    <img alt="">
  </div>

  <script src="../nav.js"></script>
  <script>
    (function () {
      var box = document.querySelector('.lightbox');
      var big = box.querySelector('img');
      function close() { box.classList.remove('show'); }
      document.querySelectorAll('.shot').forEach(function (fig) {
        fig.addEventListener('click', function () {
          var img = fig.querySelector('img');
          big.src = img.src; big.alt = img.alt;
          box.classList.add('show');
        });
      });
      box.addEventListener('click', close);
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
    })();
  </script>
</body>
</html>
